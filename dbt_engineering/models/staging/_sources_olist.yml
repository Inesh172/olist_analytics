sources:
  - name: olist
    database: olist_db
    schema: raw
    tables:
      - name: customers
        columns:
          - name: customer_id
            data_tests:            
              - unique
              - not_null  
              
          - name: customer_unique_id
            data_tests: 
              - not_null

      - name: geolocation      
      - name: orders
        columns:
          - name: order_id
            data_tests:
              - not_null
          
          - name: customer_id
            data_tests:
              - not_null 

      - name: order_items
        columns:
          - name: order_item_id
            data_tests:
              - not_null 
          
          - name: product_id
            data_tests:
              - not_null

          - name: seller_id
            data_tests:
              - not_null
          
          - name: order_id
            data_tests:
              - not_null

          - name: price
            data_tests:
              - not_null

      - name: order_payments
        columns:
          - name: order_id
            data_tests:
              - not_null 
          
          - name: payment_sequential
            data_tests:
              - not_null
      
      - name: order_reviews
        columns:
          - name: review_id
            data_tests:
              - not_null
      
      - name: products
        columns:
          - name: product_id
            data_tests:
              - unique
              - not_null
      
      - name: product_category_name
      
      - name: sellers
        columns:
          - name: seller_id
            data_tests:
              - unique
              - not_null